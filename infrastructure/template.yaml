AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serverless To-Do REST API - Cognito authentication, API Gateway, Lambda and
  DynamoDB, with a static frontend on S3 served through CloudFront.

Parameters:
  AuthDomainPrefix:
    Type: String
    Description: >-
      Globally unique prefix for the Cognito sign-in page
      (lowercase letters, numbers and hyphens, e.g. todo-yourname-2026).
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"

Resources:
  # ---------------------------------------------------------------- Data
  TodosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: todoId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: todoId
          KeyType: RANGE

  # ------------------------------------------------------------ Frontend
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

  # ---------------------------------------------------------------- Auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [implicit]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs:
        - !Sub "https://${WebsiteDistribution.DomainName}/"
      LogoutURLs:
        - !Sub "https://${WebsiteDistribution.DomainName}/"

  # ------------------------------------------------------------- Compute
  TodoFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: todos-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt TodosTable.Arn

  TodoFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: CRUD handler for /todos
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TodoFunctionRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref TodosTable
          ALLOWED_ORIGIN: !Sub "https://${WebsiteDistribution.DomainName}"
      Code:
        ZipFile: |
          import json, os, uuid
          from datetime import datetime, timezone
          import boto3
          from boto3.dynamodb.conditions import Key
          from botocore.exceptions import ClientError

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          HEADERS = {"Content-Type": "application/json",
                     "Access-Control-Allow-Origin": os.environ["ALLOWED_ORIGIN"]}

          def reply(status, body=None):
              return {"statusCode": status, "headers": HEADERS,
                      "body": "" if body is None else json.dumps(body)}

          def handler(event, context):
              # The Cognito authorizer has already validated the token; "sub" is the user's unique id.
              user_id = event["requestContext"]["authorizer"]["claims"]["sub"]
              method = event["httpMethod"]
              todo_id = (event.get("pathParameters") or {}).get("id")
              try:
                  data = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return reply(400, {"error": "Body must be valid JSON"})
              key = {"userId": user_id, "todoId": todo_id}

              if method == "GET" and not todo_id:
                  items = table.query(KeyConditionExpression=Key("userId").eq(user_id))["Items"]
                  return reply(200, sorted(items, key=lambda i: i["createdAt"]))

              if method == "GET":
                  item = table.get_item(Key=key).get("Item")
                  return reply(200, item) if item else reply(404, {"error": "Not found"})

              if method == "POST" and not todo_id:
                  title = str(data.get("title", "")).strip()
                  if not title:
                      return reply(400, {"error": "title is required"})
                  item = {"userId": user_id, "todoId": str(uuid.uuid4()), "title": title[:200],
                          "done": False, "createdAt": datetime.now(timezone.utc).isoformat()}
                  table.put_item(Item=item)
                  return reply(201, item)

              if method == "PUT" and todo_id:
                  updates = {k: data[k] for k in ("title", "done") if k in data}
                  if not updates:
                      return reply(400, {"error": "Provide title and/or done"})
                  if "done" in updates and not isinstance(updates["done"], bool):
                      return reply(400, {"error": "done must be true or false"})
                  if "title" in updates:
                      updates["title"] = str(updates["title"]).strip()[:200]
                      if not updates["title"]:
                          return reply(400, {"error": "title cannot be empty"})
                  try:
                      item = table.update_item(
                          Key=key,
                          UpdateExpression="SET " + ", ".join(f"#{k} = :{k}" for k in updates),
                          ExpressionAttributeNames={f"#{k}": k for k in updates},
                          ExpressionAttributeValues={f":{k}": v for k, v in updates.items()},
                          ConditionExpression="attribute_exists(todoId)",
                          ReturnValues="ALL_NEW")["Attributes"]
                  except ClientError as e:
                      if e.response["Error"]["Code"] == "ConditionalCheckFailedException":
                          return reply(404, {"error": "Not found"})
                      raise
                  return reply(200, item)

              if method == "DELETE" and todo_id:
                  table.delete_item(Key=key)
                  return reply(204)

              return reply(405, {"error": "Method not allowed"})

  TodoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TodoFunction}"
      RetentionInDays: 14

  # ----------------------------------------------------------------- API
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      EndpointConfiguration:
        Types: [REGIONAL]

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: cognito-user-pool
      RestApiId: !Ref Api
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt UserPool.Arn

  TodosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: todos

  TodoIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref TodosResource
      PathPart: "{id}"

  TodosAnyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref TodosResource
      HttpMethod: ANY
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TodoFunction.Arn}/invocations"

  TodoIdAnyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref TodoIdResource
      HttpMethod: ANY
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TodoFunction.Arn}/invocations"

  # CORS preflight: browsers send OPTIONS without a token, so these are unauthenticated mocks.
  TodosOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref TodosResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${WebsiteDistribution.DomainName}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  TodoIdOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref TodoIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${WebsiteDistribution.DomainName}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # Add CORS headers to API Gateway's own errors (e.g. 401 from the authorizer) so the browser can read them.
  Default4xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref Api
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${WebsiteDistribution.DomainName}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  Default5xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref Api
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${WebsiteDistribution.DomainName}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - TodosAnyMethod
      - TodoIdAnyMethod
      - TodosOptionsMethod
      - TodoIdOptionsMethod
      - Default4xxResponse
      - Default5xxResponse
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TodoFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

Outputs:
  WebsiteUrl:
    Description: Open this in the browser
    Value: !Sub "https://${WebsiteDistribution.DomainName}/"
  ApiUrl:
    Description: Base URL of the REST API
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}"
  WebsiteBucketName:
    Description: Upload the files in frontend/ to this bucket
    Value: !Ref WebsiteBucket
  ConfigJs:
    Description: Paste this line into frontend/config.js before uploading
    Value: !Sub 'window.APP_CONFIG = { apiUrl: "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}", cognitoDomain: "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com", clientId: "${UserPoolClient}" };'
